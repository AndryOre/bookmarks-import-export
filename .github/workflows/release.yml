name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "${tag_version}" != "${pkg_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Build extension zip
        run: bun run zip

      - name: Extract changelog section
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="${tag_version}" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section found for version ${tag_version}"
            exit 1
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .output/*-chrome.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path=$(ls .output/*-chrome.zip)
          gh release create "${GITHUB_REF_NAME}" "${zip_path}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: Upload extension zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension-zip
          path: .output/*-chrome.zip
          retention-days: 1

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chrome-extension-zip
          path: .output

      - name: Verify Chrome Web Store secrets are configured
        env:
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          missing=()
          [[ -z "${CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL}" ]] && missing+=("CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL")
          [[ -z "${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY}" ]] && missing+=("CHROME_SERVICE_ACCOUNT_PRIVATE_KEY")
          [[ -z "${CHROME_PUBLISHER_ID}" ]] && missing+=("CHROME_PUBLISHER_ID")
          [[ -z "${CHROME_EXTENSION_ID}" ]] && missing+=("CHROME_EXTENSION_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Chrome Web Store secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Submit to Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          zip_path=$(ls .output/*-chrome.zip)
          bunx wxt submit --chrome-zip "${zip_path}"
