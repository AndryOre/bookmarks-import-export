name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: 'fix: '
labels: ['Type: Bug', 'Status: Needs Info']

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label:
            I have searched the existing issues and confirmed this hasn't been
            reported.
          required: true

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible so it can be reproduced and fixed quickly.

  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        Link to a minimal reproduction (a sample bookmarks export file, a public
        repo, or steps against a clean profile), if applicable.
      placeholder: https://

  - type: input
    id: where
    attributes:
      label: Where observed
      description:
        Chrome Web Store version, unpacked build, or local + commit SHA.
      placeholder: 'e.g. Chrome Web Store v2.0.0 or local @ abc1234'

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recording
      description:
        If applicable, add screenshots or a screen recording to help explain the
        problem.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Chrome version, OS, and any relevant extension settings.
      placeholder: |
        - Chrome version: 128
        - OS: macOS 14
        - Extension version: 2.0.0

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description:
        Any other context about the problem (console logs, related issues,
        etc.).
